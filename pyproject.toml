[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-toolkit"
version = "1.0.0"
description = "PDF tools built on PyMuPDF and Ghostscript"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.28,<2"]

[project.scripts]
pdftoolkit = "toolkit:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["toolkit"]